title = "RuKAV Association"
baseURL = "https://rukav-swiss.ch/"
timeZone = "Europe/Zurich"
theme = ["ananke"]
resourceDir = "resources"

# Publish events dated in the future. Hugo omits future-dated content by
# default, which would make an event invisible until the day it happened —
# the opposite of what the "Upcoming events" listing needs.
buildFuture = true

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
# sectionPagesMenu = "main" # for automatic section creation
pagerSize = 5
googleAnalytics = ""
enableRobotsTXT = true
# Tags/categories are unused; empty taxonomy pages should not be indexed.
disableKinds = ["taxonomy", "term"]

[languages]

  [languages.en]
    title = "RuKAV"
    locale = "en"
    label = "English"
    weight = 1
    contentDir = "content/en"

    [[languages.en.menu.main]]
      name = "Home"
      pageRef = "/"
      weight = 1

    [[languages.en.menu.main]]
      name = "Events"
      pageRef = "/events"
      weight = 2

    [[languages.en.menu.main]]
      name = "Join us"
      pageRef = "/join-us"
      weight = 3

    [[languages.en.menu.main]]
      name = "Support us"
      pageRef = "/donate"
      weight = 4

    [[languages.en.menu.main]]
      name = "FAQ"
      pageRef = "/faq"
      weight = 5




  [languages.ru]
    title = "РуКАВ"
    locale = "ru"
    label = "Русский"
    weight = 2
    contentDir = "content/ru"

    [[languages.ru.menu.main]]
      name = "Главная"
      pageRef = "/"
      weight = 1

    [[languages.ru.menu.main]]
      name = "Мероприятия"
      pageRef = "/events"
      weight = 2

    [[languages.ru.menu.main]]
      name = "Присоединиться"
      pageRef = "/join-us"
      weight = 3

    [[languages.ru.menu.main]]
      name = "Поддержать"
      pageRef = "/donate"
      weight = 4

    [[languages.ru.menu.main]]
      name = "FAQ"
      pageRef = "/faq"
      weight = 5

  [languages.ru.params]
    description = "РуКАВ — Русскоязычная культурно-академическая ассоциация в Цюрихе, Швейцария. Мероприятия, сообщество и поддержка русскоязычных студентов и учёных."




[sitemap]
changefreq = "monthly"
priority = 0.5
filename = "sitemap.xml"

[params]
text_color = "black" #"white"
author = ""
favicon = "images/rukav_logo_square-transparent.png"
# The black logo is inverted by CSS in dark mode so only one image is fetched.
site_logo = "images/rukav_logo_square-transparent.png"
# Link-preview image for pages that have no featured_image of their own
# (home, donate, contact, ...). Resolved from assets/ by func/GetSocialImage.html.
social_image = "images/2025-07-19_Foundation-group-with-smiles.png"

# Images published byte-for-byte, with no resizing or re-encoding. The render
# hook still emits width/height for them, so they do not cause layout shift.
# Use this for anything where recompression artifacts would matter: the bank QR
# code has to stay scannable, and Hugo cannot emit truly lossless WebP.
verbatim_images = ["images/rukav_bank-qr-code.png"]
description = "RuKAV — the Russian-speaking Cultural and Academic Association in Zurich, Switzerland. Events, community, and support for Russian-speaking students and academics."
# choose a background color from any on this page: https://tachyons.io/docs/themes/skins/ and preface it with "bg-"
background_color_class = "bg-dark-blue"
featured_image_class = "cover site-hero"
recent_posts_number = 3
home_events_limit = 6

# GoatCounter analytics: cookieless, no PII, no cookie banner needed. The value
# is the account code -> https://<code>.goatcounter.com. The script is emitted
# only in production (see head-additions.html), so local dev/preview is not
# counted, and its origins are added to the CSP there too.
goatcounter = "rukav"

[params.ananke]
custom_css = ["custom.css"]

# Social links in the header, rendered as SVG icons by the theme's
# social/follow.html partial. The URLs are built from the profile templates in
# the theme's own params.toml, so only the usernames belong here.
[params.ananke.social.follow]
  networks = ["instagram", "youtube"]

[params.ananke.social.instagram]
  username = "rukav.swiss"

[params.ananke.social.youtube]
  username = "Rukav-Swiss"

# Read by layouts/events/list.html.
#   showUpcoming - render the "Upcoming events" group at all
#   maxDisplay   - cap on how many upcoming events are listed
#   dateFormat   - Go date layout used on event cards and single pages
[params.events]
  showUpcoming = true
  maxDisplay = 5
  pastMaxDisplay = 12
  dateFormat = "2 January, 2006"

# Public Google Calendar embedded on the home and events pages.
[params.calendar]
  id = "rukav.swiss@gmail.com"
  timezone = "Europe/Zurich"
  height = 600

# Facts used in JSON-LD (Organization) on every page. Keep in sync with the
# impressum on the FAQ page.
[params.organization]
  legalName = "Russischsprechender Kultureller und Akademischer Verein"
  alternateName = "РуКАВ"
  foundingDate = "2025-07-19"
  email = "contact.cause143@simplelogin.com"
  addressLocality = "Zürich"
  postalCode = "8000"
  addressCountry = "CH"
  logo = "images/rukav_logo_square-transparent.png"